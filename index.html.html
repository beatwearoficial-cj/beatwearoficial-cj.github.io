<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Catálogo de Perfumes</title>
<style>
  :root{
    --bg:#120c16;
    --bg2:#1c1420;
    --card:#221a28;
    --gold:#d4af7a;
    --gold-soft:#e8c9a0;
    --text:#f3ece4;
    --muted:#b7a9b4;
    --border:#382b3f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,var(--bg),var(--bg2) 400px);
    color:var(--text);
    min-height:100vh;
    padding-bottom:40px;
  }
  header{
    padding:32px 20px 20px;
    text-align:center;
    position:sticky;
    top:0;
    background:linear-gradient(180deg, rgba(18,12,22,0.98), rgba(18,12,22,0.9));
    backdrop-filter:blur(6px);
    z-index:10;
    border-bottom:1px solid var(--border);
  }
  header h1{
    margin:0 0 4px;
    font-size:1.5rem;
    letter-spacing:1px;
    color:var(--gold-soft);
    font-weight:600;
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:0.85rem;
  }
  .search-wrap{
    padding:16px 20px 4px;
    max-width:560px;
    margin:0 auto;
  }
  .search-wrap input{
    width:100%;
    padding:12px 16px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-size:0.95rem;
    outline:none;
  }
  .search-wrap input:focus{border-color:var(--gold);}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:14px;
    padding:16px 20px 20px;
    max-width:900px;
    margin:0 auto;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition:transform .15s ease;
  }
  .card:active{transform:scale(0.98);}
  .card .foto{
    width:100%;
    aspect-ratio:1/1;
    background:#2a2030 center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:0.75rem;
  }
  .card .info{
    padding:10px 12px 14px;
    flex:1;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .card .nombre{
    font-size:0.92rem;
    font-weight:600;
    line-height:1.25;
    color:var(--text);
  }
  .card .precio{
    font-size:1rem;
    font-weight:700;
    color:var(--gold);
    margin-top:auto;
  }
  .estado{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
    font-size:0.95rem;
  }
  .estado.error{color:#e08a8a;}
  footer{
    text-align:center;
    color:var(--muted);
    font-size:0.72rem;
    padding:24px 20px 10px;
    opacity:0.6;
  }
  .btn-whatsapp{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    width:100%;
    margin-top:4px;
    padding:9px 10px;
    border-radius:10px;
    background:#25D366;
    color:#0b2e17;
    font-weight:700;
    font-size:0.8rem;
    text-decoration:none;
    border:none;
  }
  .btn-whatsapp svg{width:14px;height:14px;flex:none;}
  .flotante-whatsapp{
    position:fixed;
    bottom:20px;
    right:20px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:#25D366;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
    z-index:20;
    text-decoration:none;
  }
  .flotante-whatsapp svg{width:28px;height:28px;}
</style>
</head>
<body>

<header>
  <h1 id="nombreTienda">Catálogo de Perfumes</h1>
  <p id="subtituloTienda">Fragancias disponibles</p>
</header>

<div class="search-wrap">
  <input type="text" id="buscador" placeholder="Buscar perfume...">
</div>

<div id="contenido">
  <div class="estado" id="estadoCarga">Cargando catálogo...</div>
</div>

<footer>Catálogo digital</footer>

<script type="module">
  // ==================================================================
  // 1) PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE (la misma que en admin.html)
  //    La obtienes en: Firebase Console > Configuración del proyecto
  //    > Tus apps > Config del SDK
  // ==================================================================
  const firebaseConfig = {
    apiKey: "AIzaSyD7WxfBYzB7XyyYj8-QBGUQMPDKCPfcgl0",
    authDomain: "perfumes-catalogo.firebaseapp.com",
    projectId: "perfumes-catalogo",
    storageBucket: "perfumes-catalogo.firebasestorage.app",
    messagingSenderId: "602774825395",
    appId: "1:602774825395:web:e6560c0e12692cbd42c3c6"
  };
  // ==================================================================

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
  import {
    getFirestore, collection, onSnapshot, query, orderBy, doc, getDoc
  } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const contenido = document.getElementById('contenido');
  const buscador = document.getElementById('buscador');
  let perfumesActuales = [];
  let whatsappNumero = '';

  const ICONO_WHATSAPP = `<svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 3C9.1 3 3.5 8.6 3.5 15.5c0 2.4.7 4.6 1.8 6.5L3 29l7.2-2.3c1.8 1 3.9 1.5 6 1.5 6.9 0 12.5-5.6 12.5-12.5S22.9 3 16 3zm0 22.7c-1.9 0-3.7-.5-5.3-1.4l-.4-.2-4.3 1.4 1.4-4.2-.2-.4C6.2 19.3 5.6 17.4 5.6 15.5 5.6 9.7 10.3 5 16 5s10.4 4.7 10.4 10.5S21.7 25.7 16 25.7zm5.8-7.9c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.1-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-1.9-1.8-2.3-.2-.3 0-.5.1-.7.1-.1.3-.4.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.2-.7-1.7-1-2.3-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2.1 3.1 5 4.4.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.9-.8 2.1-1.5.3-.7.3-1.4.2-1.5-.1-.1-.3-.2-.6-.3z"/></svg>`;

  function crearLinkWhatsapp(mensaje) {
    return `https://wa.me/${whatsappNumero}?text=${encodeURIComponent(mensaje)}`;
  }

  // Nombre, subtítulo y whatsapp de la tienda (documento config/tienda)
  const promesaConfig = getDoc(doc(db, "config", "tienda")).then(snap => {
    if (snap.exists()) {
      const data = snap.data();
      if (data.nombre) document.getElementById('nombreTienda').textContent = data.nombre;
      if (data.subtitulo) document.getElementById('subtituloTienda').textContent = data.subtitulo;
      whatsappNumero = data.whatsapp || '';
      if (whatsappNumero) {
        const flotante = document.createElement('a');
        flotante.className = 'flotante-whatsapp';
        flotante.href = crearLinkWhatsapp('Hola, tengo una pregunta sobre el catálogo de perfumes.');
        flotante.target = '_blank';
        flotante.rel = 'noopener';
        flotante.innerHTML = ICONO_WHATSAPP;
        flotante.setAttribute('aria-label', 'Contactar por WhatsApp');
        document.body.appendChild(flotante);
      }
    }
  }).catch(() => {});

  function formatoPrecio(valor) {
    const numero = Number(valor) || 0;
    return numero.toLocaleString('es-MX', { style: 'currency', currency: 'MXN' });
  }

  function render(lista) {
    if (lista.length === 0) {
      contenido.innerHTML = '<div class="estado">No hay perfumes disponibles por ahora.</div>';
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'grid';
    lista.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      const foto = document.createElement('div');
      foto.className = 'foto';
      if (p.foto) {
        foto.style.backgroundImage = `url("${p.foto}")`;
      } else {
        foto.textContent = 'Sin foto';
      }
      const info = document.createElement('div');
      info.className = 'info';
      info.innerHTML = `
        <div class="nombre">${escapeHtml(p.nombre || 'Sin nombre')}</div>
        <div class="precio">${formatoPrecio(p.precio)}</div>
      `;
      if (whatsappNumero) {
        const mensaje = `Hola, me interesa el perfume "${p.nombre || ''}" (${formatoPrecio(p.precio)}).`;
        const btn = document.createElement('a');
        btn.className = 'btn-whatsapp';
        btn.href = crearLinkWhatsapp(mensaje);
        btn.target = '_blank';
        btn.rel = 'noopener';
        btn.innerHTML = ICONO_WHATSAPP + 'Preguntar';
        info.appendChild(btn);
      }
      card.appendChild(foto);
      card.appendChild(info);
      grid.appendChild(card);
    });
    contenido.innerHTML = '';
    contenido.appendChild(grid);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[s]));
  }

  const q = query(collection(db, "perfumes"), orderBy("nombre"));
  onSnapshot(q, (snapshot) => {
    perfumesActuales = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    promesaConfig.finally(aplicarFiltro);
  }, (error) => {
    console.error(error);
    contenido.innerHTML = '<div class="estado error">No se pudo cargar el catálogo. Verifica la configuración de Firebase.</div>';
  });

  function aplicarFiltro() {
    const texto = buscador.value.trim().toLowerCase();
    const filtrados = texto
      ? perfumesActuales.filter(p => (p.nombre || '').toLowerCase().includes(texto))
      : perfumesActuales;
    render(filtrados);
  }

  buscador.addEventListener('input', aplicarFiltro);
</script>

</body>
</html>
